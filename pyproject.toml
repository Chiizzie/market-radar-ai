[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "market-radar-ai"
version = "0.1.0"
description = "Independent multi-agent market research and paper trading foundation"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7", "pydantic-settings>=2.2", "python-dotenv>=1.0", "requests>=2.32", "pandas>=2.2"]

[project.scripts]
market-radar-data-check = "market_radar_ai.market_data.cli:main"

[project.optional-dependencies]
market = ["yfinance>=0.2.54"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
