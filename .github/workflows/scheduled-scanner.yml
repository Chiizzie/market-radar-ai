# Each job is pinned to its verified runtime commit.
# Install as .github/workflows/scheduled-scanner.yml on this repository's main branch.
name: Scheduled research collection
on:
  workflow_dispatch:
    inputs:
      verify_outside_hours:
        description: 'One capture-only verification outside 08:00–23:00 Dublin (no AI)'
        type: boolean
        default: false
        required: true
permissions:
  contents: read
jobs:
  collect:
    outputs:
      review_ready: ${{ steps.collection.outputs.review_ready }}
    permissions:
      contents: write
    concurrency:
      group: market-radar-ai-scheduled-capture
      cancel-in-progress: false
    if: github.repository == 'Chiizzie/market-radar-ai' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SCANNER_COLLECTION_MODE: scheduled
      ENABLE_STOCK_DISCOVERY: 'true'
      ENABLE_BROAD_DISCOVERY: 'true'
      ENABLE_CATALYST_LINKS: 'true'
      ENABLE_CRYPTO_DISCOVERY: 'true'
      SCREEN_DISCOVERY_DATA: 'true'
      ENABLE_STOCK_CHECKS: 'true'
      SCANNER_VERIFY_OUTSIDE_WINDOW: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_outside_hours && 'true' || 'false' }}
      SEND_SCANNER_SNAPSHOT: 'true'
      SEND_COLLECTION_TELEGRAM: 'true'
      AI_FINAL_REVIEW_ENABLED: 'true'
      ENABLE_DELAYED_PREMARKET: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4b4fc934b4d7e62148a2eaf340e8ebb9184f4d05
          persist-credentials: false
      - name: Enforce Dublin operating hours before provider calls
        id: window
        run: |
          python - <<'PY'
          import os, runpy
          from datetime import datetime, timezone
          policy = runpy.run_path('src/market_radar_ai/dashboard/collection_schedule.py')
          allowed = policy['scheduled_scope'](os.environ, datetime.now(timezone.utc))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('run=' + str(allowed).lower() + '\n')
          print('Collection window open' if allowed else 'Collection paused until 08:00 Europe/Dublin')
          PY
      - uses: actions/setup-python@v5
        if: steps.window.outputs.run == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install tested collector
        if: steps.window.outputs.run == 'true'
        run: python -m pip install -e '.[market]'
      - uses: actions/cache/restore@v4
        if: steps.window.outputs.run == 'true'
        with:
          path: .scanner-cache/evidence.json
          key: scanner-evidence-v1-${{ github.run_id }}
          restore-keys: scanner-evidence-v1-
      - uses: actions/cache/restore@v4
        if: steps.window.outputs.run == 'true'
        with:
          path: .scanner-cache/discovery-universe.json
          key: scanner-universe-v1-${{ github.run_id }}
          restore-keys: scanner-universe-v1-
      - uses: actions/cache/restore@v4
        if: steps.window.outputs.run == 'true'
        with:
          path: .scanner-cache/discovery-snapshots.json
          key: scanner-signals-v1-${{ github.run_id }}
          restore-keys: scanner-signals-v1-
      - name: Collect and deliver without models or orders
        id: collection
        if: steps.window.outputs.run == 'true'
        run: python -m market_radar_ai.dashboard.scheduled_collection
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          TRADING212_API_KEY: ${{ secrets.TRADING212_API_KEY }}
          TRADING212_API_SECRET: ${{ secrets.TRADING212_API_SECRET }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          REVIEW_INGEST_SECRET: ${{ secrets.REVIEW_INGEST_SECRET }}
          GH_PAPER_TOKEN: ${{ github.token }}
      - name: Compare original published signals with this AI capture
        if: always() && steps.window.outputs.run == 'true'
        continue-on-error: true
        run: python -m market_radar_ai.dashboard.cross_scanner_audit --collection artifacts/scheduled
        env:
          REVIEW_INGEST_SECRET: ${{ secrets.REVIEW_INGEST_SECRET }}
      - name: Explain collection coverage and blockers
        if: always() && steps.window.outputs.run == 'true'
        continue-on-error: true
        run: python -m market_radar_ai.dashboard.run_diagnostics --collection artifacts/scheduled --output artifacts/scheduled/run-diagnostics.json --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/cache/save@v4
        if: always() && steps.window.outputs.run == 'true' && hashFiles('.scanner-cache/evidence.json') != ''
        with:
          path: .scanner-cache/evidence.json
          key: scanner-evidence-v1-${{ github.run_id }}
      - uses: actions/cache/save@v4
        if: always() && steps.window.outputs.run == 'true' && hashFiles('.scanner-cache/discovery-universe.json') != ''
        with:
          path: .scanner-cache/discovery-universe.json
          key: scanner-universe-v1-${{ github.run_id }}
      - uses: actions/cache/save@v4
        if: always() && steps.window.outputs.run == 'true' && hashFiles('.scanner-cache/discovery-snapshots.json') != ''
        with:
          path: .scanner-cache/discovery-snapshots.json
          key: scanner-signals-v1-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always() && steps.window.outputs.run == 'true'
        with:
          name: scheduled-capture-${{ github.run_id }}
          path: artifacts/scheduled/
          retention-days: 7
          if-no-files-found: warn

  review:
    needs: collect
    if: ${{ always() && needs.collect.outputs.review_ready == 'true' && github.run_attempt == 1 && !inputs.verify_outside_hours }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    concurrency:
      group: market-radar-ai-budget
      cancel-in-progress: false
    steps:
      - name: Enforce weekday review window; qualify each market independently
        id: review_window
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timedelta, timezone
          from zoneinfo import ZoneInfo
          now = datetime.now(timezone.utc)
          ny = now.astimezone(ZoneInfo('America/New_York'))
          dublin = now.astimezone(ZoneInfo('Europe/Dublin'))
          allowed = dublin.weekday() < 5 and 8 <= dublin.hour < 22
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('run=' + str(allowed).lower() + '\n')
          print('Free qualification may proceed; no paid call unless it passes.' if allowed else 'Outside weekday review window; no AI calls.')
          PY
      - uses: actions/checkout@v4
        if: steps.review_window.outputs.run == 'true'
        with:
          ref: cadfdc80a1d5e0f7c6559192acb9d439d607266f
          persist-credentials: false
      - uses: actions/setup-python@v5
        if: steps.review_window.outputs.run == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[market]'
        if: steps.review_window.outputs.run == 'true'
      - uses: actions/download-artifact@v4
        if: steps.review_window.outputs.run == 'true'
        with:
          name: scheduled-capture-${{ github.run_id }}
          path: artifacts/scheduled/
      - name: Six independent reviews, debate and gated research decision
        if: steps.review_window.outputs.run == 'true'
        run: |
          python -m market_radar_ai.market_data.stock_checks --capture artifacts/scheduled/enriched-capture.json --output artifacts/scheduled/fresh-reference-capture.json
          python -m market_radar_ai.market_data.reference_quotes --capture artifacts/scheduled/fresh-reference-capture.json --output artifacts/scheduled/fresh-all-reference-capture.json
          python -m market_radar_ai.agents.scheduled_review --capture artifacts/scheduled/fresh-all-reference-capture.json --evidence artifacts/scheduled/news.json --output artifacts/decision
        env:
          SCHEDULED_REVIEW_MODE: paid
          OPENAI_API_KEY: ${{ secrets.OPEN_API_KEY }}
          PAPER_FINAL_VERDICTS: 'true'
          PAPER_COMPARISON_ENABLED: 'true'
          PARALLEL_PAPER_SPECIALISTS: ${{ vars.PARALLEL_PAPER_SPECIALISTS != 'false' && 'true' || 'false' }}
          PAPER_WATCHER_ENABLED: ${{ vars.PAPER_WATCHER_ENABLED != 'false' && 'true' || 'false' }}
          SEND_PAPER_LIFECYCLE_TELEGRAM: 'true'
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          REFERENCE_VERIFICATION_DATE: '2026-11-04'
          ENABLE_STOCK_CHECKS: 'true'
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          TRADING212_API_KEY: ${{ secrets.TRADING212_API_KEY }}
          TRADING212_API_SECRET: ${{ secrets.TRADING212_API_SECRET }}
          SCHEDULED_RECOVERY_DATE: '2026-11-04'
          SCANNER_VERIFY_OUTSIDE_WINDOW: 'false'
          GH_BUDGET_TOKEN: ${{ github.token }}
          SEND_CANDIDATE_REVIEW: 'true'
          SEND_SCHEDULED_TELEGRAM: 'true'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REVIEW_INGEST_SECRET: ${{ secrets.REVIEW_INGEST_SECRET }}
          GH_PAPER_TOKEN: ${{ github.token }}
      - name: Reconcile original signals with the completed AI decision
        if: always() && steps.review_window.outputs.run == 'true'
        continue-on-error: true
        run: python -m market_radar_ai.dashboard.cross_scanner_audit --collection artifacts/scheduled --review artifacts/decision
        env:
          REVIEW_INGEST_SECRET: ${{ secrets.REVIEW_INGEST_SECRET }}
      - name: Explain review progress, blockers and recorded spending
        if: always() && steps.review_window.outputs.run == 'true'
        continue-on-error: true
        run: python -m market_radar_ai.dashboard.run_diagnostics --collection artifacts/scheduled --review artifacts/decision --output artifacts/decision/run-diagnostics.json --summary "$GITHUB_STEP_SUMMARY"
        env:
          GH_BUDGET_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        if: always() && steps.review_window.outputs.run == 'true'
        with:
          name: scheduled-decision-${{ github.run_id }}
          path: |
            artifacts/decision/
            artifacts/decision-comparison/*report.json
            artifacts/decision-comparison/*health.json
          retention-days: 7
          if-no-files-found: warn

  paper-watcher:
    if: ${{ vars.PAPER_WATCHER_ENABLED != 'false' && github.repository == 'Chiizzie/market-radar-ai' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && !inputs.verify_outside_hours }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    # Overlap successive five-minute dispatches; journal CAS merges and
    # notification reservations make the overlapping processes idempotent.
    env:
      SCANNER_COLLECTION_MODE: scheduled
      SCANNER_VERIFY_OUTSIDE_WINDOW: 'false'
      SEND_PAPER_LIFECYCLE_TELEGRAM: 'true'
    steps:
      - name: Enforce weekday collection window before installation
        id: window
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now=datetime.now(ZoneInfo('Europe/Dublin'))
          allowed=now.weekday()<5 and 8<=now.hour<23
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('run='+str(allowed).lower()+'\n')
          PY
      - uses: actions/checkout@v4
        if: steps.window.outputs.run == 'true'
        with:
          ref: 48d65b8983bb05a78fd4f7f1bb677e823e64dc79
          persist-credentials: false
      - uses: actions/setup-python@v5
        if: steps.window.outputs.run == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[market]'
        if: steps.window.outputs.run == 'true'
      - name: Verify current crypto reference without creating a plan
        if: steps.window.outputs.run == 'true'
        run: python -m market_radar_ai.agents.paper_observer --verify-crypto
      - name: Observe approved setups and prospective comparison cohorts every five seconds
        if: always() && steps.window.outputs.run == 'true'
        run: python -m market_radar_ai.agents.paper_watcher --duration 330
        env:
          PAPER_COMPARISON_ENABLED: 'true'
          REVIEW_INGEST_SECRET: ${{ secrets.REVIEW_INGEST_SECRET }}
          GH_PAPER_TOKEN: ${{ github.token }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - uses: actions/upload-artifact@v4
        if: always() && steps.window.outputs.run == 'true'
        with:
          name: paper-watcher-${{ github.run_id }}
          path: |
            artifacts/paper-watcher/*.json
            artifacts/paper-watcher/comparison/*report.json
            artifacts/paper-watcher/comparison/*health.json
          retention-days: 7
          if-no-files-found: warn


      - name: Prepare end-of-day comparison recovery export
        if: always() && steps.window.outputs.run == 'true'
        id: backup
        run: |
          python - <<'PY'
          import gzip, hashlib, json, os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo('Europe/Dublin'))
          source = Path('artifacts/paper-watcher/comparison/comparison-events.jsonl')
          ready = now.hour == 22 and now.minute < 15 and source.is_file()
          if ready:
              raw = source.read_bytes()
              root = Path('artifacts/comparison-recovery'); root.mkdir(parents=True, exist_ok=True)
              (root/'events.jsonl.gz').write_bytes(gzip.compress(raw))
              (root/'manifest.json').write_text(json.dumps({'day':now.date().isoformat(),
                  'exported_at':now.isoformat(),'sha256_uncompressed':hashlib.sha256(raw).hexdigest(),
                  'event_count':len(raw.splitlines()),'dataset_kind':'forward'}))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('ready='+str(ready).lower()+'\n')
          PY
      - uses: actions/upload-artifact@v4
        id: recovery_upload
        if: always() && steps.backup.outputs.ready == 'true'
        with:
          name: comparison-recovery-${{ github.run_id }}
          path: artifacts/comparison-recovery/
          retention-days: 30
          if-no-files-found: error

      - name: Confirm comparison recovery upload with durable metadata
        if: always() && steps.recovery_upload.outcome == 'success' && steps.backup.outputs.ready == 'true'
        run: python -m market_radar_ai.dashboard.scanner_operations --family comparison --artifact-id "${{ steps.recovery_upload.outputs.artifact-id }}" --manifest artifacts/comparison-recovery/manifest.json --output artifacts/comparison-recovery/receipt.json
        env:
          GH_HEALTH_TOKEN: ${{ github.token }}
          REVIEW_INGEST_SECRET: ${{ secrets.REVIEW_INGEST_SECRET }}

  method-shadow:
    needs: collect
    if: ${{ always() && github.repository == 'Chiizzie/market-radar-ai' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && !inputs.verify_outside_hours && vars.METHOD_SHADOW_ENABLED != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      actions: read
      contents: read
    # Independent of the paid review. Overlapping runs retain first enrolment.
    steps:
      - name: Enforce stock session window for the method experiment
        id: window
        run: |
          python - <<'PYCODE'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now=datetime.now(ZoneInfo('America/New_York'))
          allowed=now.weekday()<5 and (9,30)<=(now.hour,now.minute)<=(16,15)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('run='+str(allowed).lower()+'\n')
          PYCODE
      - uses: actions/checkout@v4
        if: steps.window.outputs.run == 'true'
        with:
          ref: 4b4fc934b4d7e62148a2eaf340e8ebb9184f4d05
          persist-credentials: false
      - uses: actions/setup-python@v5
        if: steps.window.outputs.run == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[market]'
        if: steps.window.outputs.run == 'true'
      - uses: actions/download-artifact@v4
        if: steps.window.outputs.run == 'true'
        continue-on-error: true
        with:
          name: scheduled-capture-${{ github.run_id }}
          path: artifacts/scheduled/
      - name: Screen and observe fixed AVWAP method without AI or notifications
        if: steps.window.outputs.run == 'true'
        run: |
          if test -f artifacts/scheduled/enriched-capture.json && test -f artifacts/scheduled/news.json; then
            python -m market_radar_ai.agents.method_shadow --capture artifacts/scheduled/enriched-capture.json --evidence artifacts/scheduled/news.json --output artifacts/method-shadow --duration 330 --with-early-opening --with-competitor --discovery artifacts/scheduled/discovery.json --manifest artifacts/scheduled/discovery-selection.json
          else
            python -m market_radar_ai.agents.method_shadow --observe-only --output artifacts/method-shadow --duration 330 --with-early-opening --with-competitor --discovery artifacts/scheduled/discovery.json --manifest artifacts/scheduled/discovery-selection.json
          fi
        env:
          REVIEW_INGEST_SECRET: ${{ secrets.REVIEW_INGEST_SECRET }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          TRADING212_API_KEY: ${{ secrets.TRADING212_API_KEY }}
          TRADING212_API_SECRET: ${{ secrets.TRADING212_API_SECRET }}
      - uses: actions/upload-artifact@v4
        if: always() && steps.window.outputs.run == 'true'
        with:
          name: method-shadow-${{ github.run_id }}
          path: |
            artifacts/method-shadow/*report.json
            artifacts/method-shadow/early-opening/early-opening-report.json
            artifacts/method-shadow/early-opening/method-events.jsonl
            artifacts/method-shadow/competitor/competitor-shadow-report.json
            artifacts/method-shadow/competitor/method-events.jsonl
          retention-days: 7
          if-no-files-found: warn
      - name: Export end-of-session method evidence for recovery
        id: backup
        if: always() && steps.window.outputs.run == 'true'
        run: |
          python - <<'PYCODE'
          import gzip,hashlib,json,os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          now=datetime.now(ZoneInfo('America/New_York'))
          source=Path('artifacts/method-shadow/method-events.jsonl')
          ready=now.hour==16 and source.is_file()
          if ready:
              raw=source.read_bytes()
              root=Path('artifacts/method-recovery');root.mkdir(parents=True,exist_ok=True)
              (root/'events.jsonl.gz').write_bytes(gzip.compress(raw))
              (root/'manifest.json').write_text(json.dumps({'day':now.date().isoformat(),
                  'sha256_uncompressed':hashlib.sha256(raw).hexdigest(),'event_count':len(raw.splitlines()),
                  'dataset_kind':'forward','trade_authorized':False}))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('ready='+str(ready).lower()+'\n')
          PYCODE
      - uses: actions/upload-artifact@v4
        id: recovery_upload
        if: always() && steps.backup.outputs.ready == 'true'
        with:
          name: method-recovery-${{ github.run_id }}
          path: artifacts/method-recovery/
          retention-days: 30
          if-no-files-found: error

      - name: Confirm method recovery upload with durable metadata
        if: always() && steps.recovery_upload.outcome == 'success' && steps.backup.outputs.ready == 'true'
        run: python -m market_radar_ai.dashboard.scanner_operations --family method --artifact-id "${{ steps.recovery_upload.outputs.artifact-id }}" --manifest artifacts/method-recovery/manifest.json --output artifacts/method-recovery/receipt.json
        env:
          GH_HEALTH_TOKEN: ${{ github.token }}
          REVIEW_INGEST_SECRET: ${{ secrets.REVIEW_INGEST_SECRET }}

  account-sync:
    if: ${{ vars.ACCOUNT_SYNC_ENABLED != 'false' && github.repository == 'Chiizzie/market-radar-ai' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && !inputs.verify_outside_hours }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    concurrency:
      group: market-radar-ai-private-account
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cadfdc80a1d5e0f7c6559192acb9d439d607266f
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Sync private account without models or order operations
        run: python -m market_radar_ai.dashboard.account_sync
        env:
          SCANNER_COLLECTION_MODE: scheduled
          ENABLE_ACCOUNT_SYNC: 'true'
          ENABLE_POSITION_MONITOR: 'true'
          SEND_POSITION_MONITOR_TELEGRAM: 'true'
          GH_PAPER_TOKEN: ${{ github.token }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TRADING212_API_KEY: ${{ secrets.TRADING212_API_KEY }}
          TRADING212_API_SECRET: ${{ secrets.TRADING212_API_SECRET }}
          REVIEW_INGEST_SECRET: ${{ secrets.REVIEW_INGEST_SECRET }}
    # Deliberately no artifacts, caches, raw payload files or financial log summaries.

  market-context:
    needs: collect
    if: ${{ always() && needs.collect.outputs.review_ready == 'true' && github.repository == 'Chiizzie/market-radar-ai' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && !inputs.verify_outside_hours && vars.CONTEXT_RESEARCH_ENABLED != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    concurrency:
      group: market-radar-ai-context-research
      cancel-in-progress: false
    steps:
      - name: Check context collection window
        id: window
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now=datetime.now(ZoneInfo('America/New_York'))
          allowed=now.weekday()<5 and (9,35)<=(now.hour,now.minute)<=(16,15)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('run='+str(allowed).lower()+'\n')
          PY
      - uses: actions/checkout@v4
        if: steps.window.outputs.run == 'true'
        with:
          ref: f9a1ed0750e10f2ef76d3350f895a6ee40d4db35
          persist-credentials: false
      - uses: actions/setup-python@v5
        if: steps.window.outputs.run == 'true'
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
        if: steps.window.outputs.run == 'true'
      - uses: actions/download-artifact@v4
        if: steps.window.outputs.run == 'true'
        with:
          name: scheduled-capture-${{ github.run_id }}
          path: artifacts/scheduled/
      - uses: actions/cache/restore@v4
        if: steps.window.outputs.run == 'true'
        with:
          path: .scanner-cache/market-context.json
          key: market-context-v1-${{ github.run_id }}
          restore-keys: market-context-v1-
      - name: Record market and sector context without changing trade decisions
        if: steps.window.outputs.run == 'true'
        run: python -m market_radar_ai.market_data.market_context --capture artifacts/scheduled/enriched-capture.json --publish
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          REVIEW_INGEST_SECRET: ${{ secrets.REVIEW_INGEST_SECRET }}
      - uses: actions/cache/save@v4
        if: always() && steps.window.outputs.run == 'true' && hashFiles('.scanner-cache/market-context.json') != ''
        with:
          path: .scanner-cache/market-context.json
          key: market-context-v1-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always() && steps.window.outputs.run == 'true'
        with:
          name: market-context-${{ github.run_id }}
          path: |
            artifacts/market-context/report.json
            .scanner-cache/market-context.json
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: warn

