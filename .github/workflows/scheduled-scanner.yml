# Deployment template: replace b6503c6591c23ad9f305e718de690e52e91f75ed with a verified backend SHA.
# Install as .github/workflows/scheduled-scanner.yml on this repository's main branch.
name: Scheduled research collection
on:
  workflow_dispatch:
    inputs:
      verify_outside_hours:
        description: 'One capture-only verification outside 08:00–23:00 Dublin (no AI)'
        type: boolean
        default: false
        required: true
permissions:
  contents: read
jobs:
  collect:
    concurrency:
      group: market-radar-ai-scheduled-capture
      cancel-in-progress: false
    if: github.repository == 'Chiizzie/market-radar-ai' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SCANNER_COLLECTION_MODE: scheduled
      ENABLE_STOCK_DISCOVERY: 'true'
      ENABLE_STOCK_CHECKS: 'true'
      SCANNER_VERIFY_OUTSIDE_WINDOW: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_outside_hours && 'true' || 'false' }}
      SEND_SCANNER_SNAPSHOT: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b6503c6591c23ad9f305e718de690e52e91f75ed
          persist-credentials: false
      - name: Enforce Dublin operating hours before provider calls
        id: window
        run: |
          python - <<'PY'
          import os, runpy
          from datetime import datetime, timezone
          policy = runpy.run_path('src/market_radar_ai/dashboard/collection_schedule.py')
          allowed = policy['scheduled_scope'](os.environ, datetime.now(timezone.utc))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('run=' + str(allowed).lower() + '\n')
          print('Collection window open' if allowed else 'Collection paused until 08:00 Europe/Dublin')
          PY
      - uses: actions/setup-python@v5
        if: steps.window.outputs.run == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install tested collector
        if: steps.window.outputs.run == 'true'
        run: python -m pip install -e '.[market]'
      - uses: actions/cache/restore@v4
        if: steps.window.outputs.run == 'true'
        with:
          path: .scanner-cache/evidence.json
          key: scanner-evidence-v1-${{ github.run_id }}
          restore-keys: scanner-evidence-v1-
      - name: Collect and deliver without models or orders
        if: steps.window.outputs.run == 'true'
        run: python -m market_radar_ai.dashboard.scheduled_collection
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          TRADING212_API_KEY: ${{ secrets.TRADING212_API_KEY }}
          TRADING212_API_SECRET: ${{ secrets.TRADING212_API_SECRET }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          REVIEW_INGEST_SECRET: ${{ secrets.REVIEW_INGEST_SECRET }}
      - uses: actions/cache/save@v4
        if: always() && steps.window.outputs.run == 'true' && hashFiles('.scanner-cache/evidence.json') != ''
        with:
          path: .scanner-cache/evidence.json
          key: scanner-evidence-v1-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always() && steps.window.outputs.run == 'true'
        with:
          name: scheduled-capture-${{ github.run_id }}
          path: artifacts/scheduled/
          retention-days: 3
          if-no-files-found: warn

  review:
    needs: collect
    if: always() && (needs.collect.result == 'success' || needs.collect.result == 'failure') && !inputs.verify_outside_hours
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    concurrency:
      group: market-radar-ai-budget
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b6503c6591c23ad9f305e718de690e52e91f75ed
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[market]'
      - uses: actions/download-artifact@v4
        with:
          name: scheduled-capture-${{ github.run_id }}
          path: artifacts/scheduled/
      - name: Six independent reviews, debate and gated research decision
        run: python -m market_radar_ai.agents.scheduled_review --capture artifacts/scheduled/enriched-capture.json --evidence artifacts/scheduled/news.json --output artifacts/decision
        env:
          SCHEDULED_REVIEW_MODE: paid
          SCHEDULED_RECOVERY_DATE: '2026-11-04'
          SCANNER_VERIFY_OUTSIDE_WINDOW: 'false'
          OPENAI_API_KEY: ${{ secrets.OPEN_API_KEY }}
          GH_BUDGET_TOKEN: ${{ github.token }}
          SEND_CANDIDATE_REVIEW: 'true'
          SEND_SCHEDULED_TELEGRAM: 'true'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REVIEW_INGEST_SECRET: ${{ secrets.REVIEW_INGEST_SECRET }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scheduled-decision-${{ github.run_id }}
          path: artifacts/decision/
          retention-days: 7
          if-no-files-found: warn
