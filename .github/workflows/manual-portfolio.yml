name: Manual shared paper portfolio
on:
  schedule:
    # UTC candidates; the job applies the Europe/Dublin weekday window.
    - cron: '7,22,37,52 7-22 * * 1-5'
  workflow_dispatch:
  workflow_run:
    workflows: ['Scheduled research collection']
    types: [completed]
  push:
    branches: [main]
    paths: ['.github/workflows/manual-portfolio.yml']
permissions:
  contents: read
concurrency:
  group: market-radar-ai-manual-portfolio
  cancel-in-progress: false
jobs:
  replay:
    # Main-scan completion is the primary trigger; the timer is a fallback.
    # Never trust a fork/branch run or run unpinned code with the ingest secret.
    if: >-
      github.repository == 'Chiizzie/market-radar-ai' &&
      github.ref == 'refs/heads/main' &&
      vars.MANUAL_PORTFOLIO_ENABLED != 'false' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.run_attempt == 1 &&
        github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Apply the weekday window or explicit commissioning run
        id: window
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now=datetime.now(ZoneInfo('Europe/Dublin'))
          allowed=os.environ['GITHUB_EVENT_NAME'] in ('push','workflow_dispatch') or (now.weekday()<5 and 8<=now.hour<23)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('run='+str(allowed).lower()+'\n')
              f.write('day='+now.astimezone(ZoneInfo('UTC')).date().isoformat()+'\n')
          PY
      - uses: actions/checkout@v4
        if: steps.window.outputs.run == 'true'
        with:
          ref: 71b514221835f09fc541d43b98b3ab3781a91dac
          persist-credentials: false
      - uses: actions/setup-python@v5
        if: steps.window.outputs.run == 'true'
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
        if: steps.window.outputs.run == 'true'
      - name: Restore validated past-day comparison events
        id: closed_history
        uses: actions/cache/restore@v4
        if: steps.window.outputs.run == 'true'
        continue-on-error: true
        with:
          path: .scanner-cache/report-closed-history
          key: report-closed-history-v1-${{ steps.window.outputs.day }}
          restore-keys: report-closed-history-v1-
      - name: Restore the current watcher prefix
        uses: actions/cache/restore@v4
        if: steps.window.outputs.run == 'true'
        continue-on-error: true
        with:
          path: .scanner-cache/comparison-prefix
          key: comparison-prefix-v1-${{ steps.window.outputs.day }}-${{ github.run_id }}
          restore-keys: comparison-prefix-v1-${{ steps.window.outputs.day }}-
      - name: Replay separate accounts and verify complete ledger recovery
        if: steps.window.outputs.run == 'true'
        run: python -m market_radar_ai.agents.manual_portfolio --publish
        env:
          REPORT_CLOSED_HISTORY_DIR: .scanner-cache/report-closed-history
          REPORT_LIVE_PREFIX_DIR: .scanner-cache/comparison-prefix
          REVIEW_INGEST_SECRET: ${{ secrets.REVIEW_INGEST_SECRET }}
      - uses: actions/upload-artifact@v4
        if: always() && steps.window.outputs.run == 'true'
        with:
          name: manual-portfolio-${{ github.run_id }}
          path: artifacts/manual-portfolio/
          retention-days: 30
          if-no-files-found: error


