name: Manual shared paper portfolio
on:
  schedule:
    # UTC candidates; the job applies the Europe/Dublin weekday window.
    - cron: '7,22,37,52 7-22 * * 1-5'
  workflow_dispatch:
  workflow_run:
    workflows: ['Scheduled research collection']
    types: [completed]
  push:
    branches: [main]
    paths: ['.github/workflows/manual-portfolio.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: market-radar-ai-manual-portfolio
  cancel-in-progress: false
jobs:
  replay:
    # Main-scan completion is the primary trigger; the timer is a fallback.
    # Never trust a fork/branch run or run unpinned code with the ingest secret.
    if: >-
      github.repository == 'Chiizzie/market-radar-ai' &&
      github.ref == 'refs/heads/main' &&
      vars.MANUAL_PORTFOLIO_ENABLED != 'false' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.run_attempt == 1 &&
        contains(fromJSON('["success","failure"]'), github.event.workflow_run.conclusion)))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Apply the weekday window or explicit commissioning run
        id: window
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now=datetime.now(ZoneInfo('Europe/Dublin'))
          event=os.environ['GITHUB_EVENT_NAME']
          allowed=event in ('push','workflow_dispatch') or (now.weekday()<5 and 8<=now.hour<23)
          if event=='workflow_run':
              with open(os.environ['GITHUB_EVENT_PATH']) as source:
                  parent=json.load(source)['workflow_run']
              dispatched=datetime.fromisoformat(parent['created_at'].replace('Z','+00:00'))
              allowed=allowed and 5 <= dispatched.minute % 15 < 10 and 0 <= (now-dispatched).total_seconds() < 1200
          if allowed and event in ('schedule','workflow_run'):
              # A recent real export satisfies a duplicate timer/scan trigger.
              # A green window-only job or a failed read never suppresses a report.
              api='repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/'
              def get(path):
                  response=subprocess.run(['gh','api',api+path],capture_output=True,check=True,timeout=8)
                  return json.loads(response.stdout)
              try:
                  runs=get('workflows/manual-portfolio.yml/runs?branch=main&status=success&per_page=8')
                  for run in runs['workflow_runs']:
                      ended=datetime.fromisoformat(run['updated_at'].replace('Z','+00:00'))
                      if not 0 <= (now-ended).total_seconds() < 600: continue
                      artifacts=get('runs/'+str(run['id'])+'/artifacts')['artifacts']
                      name='manual-portfolio-'+str(run['id'])
                      if any(a['name']==name and not a['expired'] for a in artifacts):
                          allowed=False
                          break
              except (subprocess.SubprocessError,OSError,ValueError,KeyError):
                  print('GitHub freshness check unavailable; using the scheduled report window.')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('run='+str(allowed).lower()+'\n')
              f.write('day='+now.astimezone(ZoneInfo('UTC')).date().isoformat()+'\n')
          PY
      - uses: actions/checkout@v4
        if: steps.window.outputs.run == 'true'
        with:
          ref: 71b514221835f09fc541d43b98b3ab3781a91dac
          persist-credentials: false
      - uses: actions/setup-python@v5
        if: steps.window.outputs.run == 'true'
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
        if: steps.window.outputs.run == 'true'
      - name: Restore validated past-day comparison events
        id: closed_history
        uses: actions/cache/restore@v4
        if: steps.window.outputs.run == 'true'
        continue-on-error: true
        with:
          path: .scanner-cache/report-closed-history
          key: report-closed-history-v1-${{ steps.window.outputs.day }}
          restore-keys: report-closed-history-v1-
      - name: Restore the current watcher prefix
        uses: actions/cache/restore@v4
        if: steps.window.outputs.run == 'true'
        continue-on-error: true
        with:
          path: .scanner-cache/comparison-prefix
          key: comparison-prefix-v1-${{ steps.window.outputs.day }}-${{ github.run_id }}
          restore-keys: comparison-prefix-v1-${{ steps.window.outputs.day }}-
      - name: Replay separate accounts and verify complete ledger recovery
        if: steps.window.outputs.run == 'true'
        run: python -m market_radar_ai.agents.manual_portfolio --publish
        env:
          REPORT_CLOSED_HISTORY_DIR: .scanner-cache/report-closed-history
          REPORT_LIVE_PREFIX_DIR: .scanner-cache/comparison-prefix
          REVIEW_INGEST_SECRET: ${{ secrets.REVIEW_INGEST_SECRET }}
      - uses: actions/upload-artifact@v4
        if: always() && steps.window.outputs.run == 'true'
        with:
          name: manual-portfolio-${{ github.run_id }}
          path: artifacts/manual-portfolio/
          retention-days: 30
          if-no-files-found: error


