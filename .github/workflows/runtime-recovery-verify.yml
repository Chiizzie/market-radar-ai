name: Verify deployed comparison recovery
on:
  push:
    branches: [main]
    paths: ['.github/workflows/runtime-recovery-verify.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 208f4bf5f9f1f403fb977075f0ea33912f4463b0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e .
      - name: Verify today's history without market data, AI, alerts or orders
        run: python scripts/verify_comparison_checkpoint.py --day 2026-11-13 --output artifacts/checkpoint-recovery.json --checkpoint .scanner-cache/comparison-prefix
        env:
          REVIEW_INGEST_SECRET: ${{ secrets.REVIEW_INGEST_SECRET }}
          RUNTIME_REVISION: 208f4bf5f9f1f403fb977075f0ea33912f4463b0
      - uses: actions/cache/save@v4
        with:
          path: .scanner-cache/comparison-prefix
          key: comparison-prefix-v1-2026-11-13-seed-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployed-runtime-recovery-${{ github.run_id }}
          path: artifacts/checkpoint-recovery.json
          if-no-files-found: error
          retention-days: 30

