name: Read-only Trading 212 catalogue check
on:
  workflow_dispatch:
  push:
    branches: ['phase-1/market-data-layer']
    paths:
      - '.github/workflows/broker-check.yml'
      - 'src/market_radar_ai/market_data/broker_check.py'
permissions:
  contents: read
concurrency:
  group: trading212-catalogue-check
  cancel-in-progress: false
jobs:
  catalogue:
    if: github.repository == 'Chiizzie/market-radar-ai' && github.ref == 'refs/heads/phase-1/market-data-layer'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q tests/test_broker_check.py
      - name: Fetch instrument and exchange metadata only
        run: python -m market_radar_ai.market_data.broker_check
        env:
          TRADING212_API_KEY: ${{ secrets.TRADING212_API_KEY }}
          TRADING212_API_SECRET: ${{ secrets.TRADING212_API_SECRET }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trading212-catalogue-${{ github.run_id }}
          path: artifacts/broker-check/result.json
          retention-days: 7
