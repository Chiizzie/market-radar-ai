name: Fresh paper-plan review
on:
  workflow_dispatch:
    inputs:
      paid_analysis:
        description: 'Run one metered eight-call review under the existing shared caps'
        type: boolean
        required: true
        default: false
  push:
    branches: ['phase-1/market-data-layer']
    paths:
      - '.github/workflows/plan-review.yml'
      - 'src/market_radar_ai/agents/github_plan_review.py'
permissions:
  contents: read
jobs:
  review:
    if: github.repository == 'Chiizzie/market-radar-ai' && github.ref == 'refs/heads/phase-1/market-data-layer'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    concurrency:
      group: market-radar-ai-budget
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,market]'
      - run: python -m pytest -q tests/test_plan_review.py tests/test_github_plan_review.py
      - name: Capture fresh evidence and optionally review the plan
        run: python -m market_radar_ai.agents.github_plan_review
        env:
          PLAN_REVIEW_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.paid_analysis && 'paid' || 'dry_run' }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          TRADING212_API_KEY: ${{ secrets.TRADING212_API_KEY }}
          TRADING212_API_SECRET: ${{ secrets.TRADING212_API_SECRET }}
          OPENAI_API_KEY: ${{ github.event_name == 'workflow_dispatch' && inputs.paid_analysis && secrets.OPEN_API_KEY || '' }}
          GH_BUDGET_TOKEN: ${{ github.event_name == 'workflow_dispatch' && inputs.paid_analysis && github.token || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plan-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/plan-review/
          retention-days: 30
