name: Public news verification
on:
  push:
    branches: ['phase-1/market-data-layer']
    paths:
      - 'src/market_radar_ai/evidence/**'
      - 'src/market_radar_ai/agents/news_input.py'
      - 'src/market_radar_ai/agents/combined_input.py'
      - 'tests/test_combined_input.py'
      - 'tests/test_news_input.py'
      - 'src/market_radar_ai/dashboard/evidence.py'
      - '.github/workflows/news-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-news:
    if: github.repository == 'Chiizzie/market-radar-ai' && github.ref == 'refs/heads/phase-1/market-data-layer'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,market]'
      - run: python -m pytest -q tests/test_public_feed.py tests/test_evidence_export.py tests/test_company_news.py tests/test_combined_news.py tests/test_news_evidence.py tests/test_news_input.py tests/test_combined_input.py
      - name: Retrieve official macro feed
        run: python -m market_radar_ai.evidence.public_feed --output artifacts/news/news.json
      - name: Export news-only dashboard for import
        if: always()
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          from market_radar_ai.market_data.capture import capture_markets
          from market_radar_ai.dashboard.export import build_snapshot
          root = Path('artifacts/news')
          feed = json.loads((root/'news.json').read_text())
          capture = capture_markets([], [], stock_fetch=None, crypto_fetch=None)
          snapshot = build_snapshot(capture, now=datetime.now(timezone.utc), evidence=feed)
          (root/'dashboard.json').write_text(json.dumps(snapshot, indent=2)+'\n')
          print(json.dumps({'feed_status':snapshot['evidence']['status'], 'article_count':len(snapshot['evidence']['items']), 'scope':snapshot['evidence']['scope']}))
          PY
      - name: Probe company-specific news separately
        if: always()
        continue-on-error: true
        run: python -m market_radar_ai.evidence.company_news --symbol MSFT --output artifacts/news/company-news.json
      - name: Probe direct issuer announcements independently
        if: always()
        continue-on-error: true
        run: python -m market_radar_ai.evidence.public_feed --issuer --output artifacts/news/issuer-news.json
      - name: Retrieve NVIDIA issuer feed
        if: always()
        continue-on-error: true
        run: python -m market_radar_ai.evidence.public_feed --source nvidia --output artifacts/news/nvidia-news.json
      - name: Combine feeds without hiding provider failures
        if: always()
        run: |
          python -m market_radar_ai.evidence.combine --feeds artifacts/news/news.json artifacts/news/company-news.json artifacts/news/issuer-news.json artifacts/news/nvidia-news.json --output artifacts/news/combined-news.json
          python - <<'PYCODE'
          import json
          from pathlib import Path
          from datetime import datetime, timezone
          from market_radar_ai.dashboard.export import build_snapshot
          from market_radar_ai.market_data.capture import capture_markets
          root=Path('artifacts/news')
          feed=json.loads((root/'combined-news.json').read_text())
          snapshot=build_snapshot(capture_markets([],[],stock_fetch=None,crypto_fetch=None),now=datetime.now(timezone.utc),evidence=feed)
          (root/'dashboard.json').write_text(json.dumps(snapshot,indent=2)+'\n')
          PYCODE
      - name: Prepare dated NVDA research input without model calls
        if: always()
        continue-on-error: true
        run: python -m market_radar_ai.agents.news_input --evidence artifacts/news/combined-news.json --symbol NVDA --output artifacts/news/nvda-research-input.json
      - name: Capture bounded NVDA candle evidence
        if: always()
        continue-on-error: true
        run: |
          python - <<'PYCODE'
          import json
          from pathlib import Path
          from market_radar_ai.market_data.capture import capture_markets
          from market_radar_ai.market_data.providers.yahoo import YahooFinanceProvider
          capture=capture_markets(['NVDA'],[],stock_fetch=lambda symbol: YahooFinanceProvider().fetch_history(symbol,period='1d',interval='5m'),crypto_fetch=None)
          Path('artifacts/news/nvda-capture.json').write_text(json.dumps(capture,indent=2)+'\n')
          print(json.dumps(capture['coverage']))
          PYCODE
      - name: Assemble combined research evidence without paid analysis
        if: always()
        continue-on-error: true
        run: python -m market_radar_ai.agents.combined_input --capture artifacts/news/nvda-capture.json --evidence artifacts/news/combined-news.json --symbol NVDA --output artifacts/news/nvda-combined-input.json
      - name: Check news delivery acceptance independently
        if: always()
        continue-on-error: true
        run: python -m market_radar_ai.evidence.readiness --macro artifacts/news/news.json --company artifacts/news/company-news.json --output artifacts/news/news-readiness.json
      - name: Check direct issuer delivery independently
        if: always()
        continue-on-error: true
        run: python -m market_radar_ai.evidence.readiness --macro artifacts/news/news.json --company artifacts/news/issuer-news.json --output artifacts/news/issuer-readiness.json
      - name: Check NVIDIA delivery independently
        if: always()
        continue-on-error: true
        run: python -m market_radar_ai.evidence.readiness --macro artifacts/news/news.json --company artifacts/news/nvidia-news.json --output artifacts/news/nvidia-readiness.json
      - name: Publish explicit delivery status
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path('artifacts/news')
          lines = ['## News delivery acceptance', '', '| Source | Status | Validated articles |', '| --- | --- | --- |']
          try:
              combined = json.loads((root/'combined-news.json').read_text())
              for source in combined['sources']:
                  lines.append(f"| {source['source_index']} | {source['status']} | {source['validated_item_count']} |")
          except (OSError, ValueError, KeyError):
              lines.append('| Combined report unavailable | error | unknown |')
          for label, filename in [('Yahoo company news', 'news-readiness.json'), ('Microsoft issuer news', 'issuer-readiness.json'), ('NVIDIA issuer news', 'nvidia-readiness.json')]:
              try:
                  verified = json.loads((root/filename).read_text())['news_delivery_verified'] is True
              except (OSError, ValueError, KeyError):
                  verified = False
              lines.append(f"\n{label}: {'VERIFIED DELIVERY' if verified else 'NOT VERIFIED'}")
          lines.append('\nWorkflow completion is not news readiness or trade authorization. No paid AI calls were made.')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('\n'.join(lines)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-news-verification
          path: artifacts/news/
          if-no-files-found: error
          retention-days: 30
