name: Verify durable comparison storage
on:
  push:
    branches: [main]
    paths: ['.github/workflows/comparison-storage-verify.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify:
    if: github.repository == 'Chiizzie/market-radar-ai' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f495e4f26f8b0d199b397505243925dd13fffb9a
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Verify signed storage, idempotent write and independent recovery
        env:
          REVIEW_INGEST_SECRET: ${{ secrets.REVIEW_INGEST_SECRET }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          from market_radar_ai.agents.comparison_live import EventClient, LiveComparison, restore_events
          client = EventClient(os.environ.get('REVIEW_INGEST_SECRET'))
          first = LiveComparison('artifacts/storage-verify/first', client=client)
          first.sync()
          first.close()  # A real summary of the stored cohort, never a fabricated trade.
          events = [json.loads(line) for line in (first.root/'comparison-events.jsonl').read_text().splitlines()]
          last = events[-1]
          client.append(first.experiment, [{k:last[k] for k in ('kind','occurred_at','payload_json')}])
          second = LiveComparison('artifacts/storage-verify/independent', client=client, day=first.day)
          second.sync()
          assert second.seen == first.seen, 'Duplicate write changed the evidence set'
          restored = restore_events(first.root/'comparison-events.jsonl', 'artifacts/storage-verify/restored', client=client, day=first.day)
          now = datetime.now(timezone.utc)
          expected = first.store.report(now=now)
          assert second.store.report(now=now) == expected
          assert restored.report(now=now) == expected
          result = {'state':'signed_storage_and_restore_verified','cohort_count':expected['cohort_count'],
                    'events_verified':len(events),'model_calls':0,'provider_quote_calls':0,
                    'trades_created':0,'telegram_messages':0,'trade_authorized':False}
          Path('artifacts/storage-verify/result.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: comparison-storage-verification-${{ github.run_id }}
          path: artifacts/storage-verify/result.json
          retention-days: 30
          if-no-files-found: warn

      - name: Archive the actual stored verification cohort
        run: |
          python - <<'PY'
          import gzip,hashlib,json
          from datetime import datetime,timezone
          from pathlib import Path
          raw=Path('artifacts/storage-verify/first/comparison-events.jsonl').read_bytes()
          assert raw.strip(), 'No evidence export produced'
          root=Path('artifacts/comparison-recovery');root.mkdir(parents=True,exist_ok=True)
          archive=gzip.compress(raw);(root/'events.jsonl.gz').write_bytes(archive)
          assert gzip.decompress(archive)==raw
          (root/'manifest.json').write_text(json.dumps({'day':datetime.now(timezone.utc).date().isoformat(),
              'sha256_uncompressed':hashlib.sha256(raw).hexdigest(),'event_count':len(raw.splitlines()),
              'dataset_kind':'forward','trade_authorized':False}))
          PY
      - uses: actions/upload-artifact@v4
        id: recovery_upload
        with:
          name: comparison-recovery-${{ github.run_id }}
          path: artifacts/comparison-recovery/
          retention-days: 30
          if-no-files-found: error
      - name: Verify uploaded artifact metadata and record a recovery receipt
        run: python -m market_radar_ai.dashboard.scanner_operations --family comparison --artifact-id "${{ steps.recovery_upload.outputs.artifact-id }}" --manifest artifacts/comparison-recovery/manifest.json --output artifacts/comparison-recovery/receipt.json
        env:
          GH_HEALTH_TOKEN: ${{ github.token }}
          REVIEW_INGEST_SECRET: ${{ secrets.REVIEW_INGEST_SECRET }}
