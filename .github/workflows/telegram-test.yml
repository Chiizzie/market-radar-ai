name: Manual Telegram connection test
on:
  workflow_dispatch:
    inputs:
      send_test:
        description: Send one research-only connection test to configured chat
        type: boolean
        required: true
        default: false
permissions:
  contents: read
jobs:
  test:
    if: github.repository == 'Chiizzie/market-radar-ai' && github.ref == 'refs/heads/phase-1/market-data-layer' && inputs.send_test && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: market-radar-ai-telegram-test
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q tests/test_telegram_check.py
      - run: python -m market_radar_ai.dashboard.telegram_check
        env:
          SEND_TELEGRAM_TEST: 'true'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
