name: Phase 1 verification
on:
  push:
    branches: ['phase-1/market-data-layer']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,market]'
      - run: python -m pytest -q
      - run: python -m compileall -q src tests
      - run: python -m market_radar_ai.agents.offline_run --scenario objection
      - run: python -m market_radar_ai.agents.offline_run --scenario supported
  budget-storage:
    needs: tests
    if: github.event_name == 'push' && github.repository == 'Chiizzie/market-radar-ai' && github.ref == 'refs/heads/phase-1/market-data-layer'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: market-radar-ai-budget
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[market]'
      - name: Verify persistent budget storage without paid calls
        run: python -m market_radar_ai.agents.github_pilot
        env:
          GH_BUDGET_TOKEN: ${{ github.token }}
      - name: One-time OpenAI connectivity check (explicit opt-in only)
        if: vars.RUN_OPENAI_CONNECTIVITY == 'enabled'
        run: python -m market_radar_ai.agents.github_pilot
        env:
          GH_BUDGET_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPEN_API_KEY }}
          RUN_OPENAI_CONNECTIVITY: enabled
      - name: Authorized one-shot six-role research evaluation
        if: vars.RUN_RESEARCH_EVAL == 'enabled'
        run: python -m market_radar_ai.agents.github_research_eval
        env:
          GH_BUDGET_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPEN_API_KEY }}
          RUN_RESEARCH_EVAL: enabled
      - name: Preserve synthetic evaluation report
        if: always() && vars.RUN_RESEARCH_EVAL == 'enabled'
        uses: actions/upload-artifact@v4
        with:
          name: research-evaluation-v1
          path: artifacts/research-eval/result.json
          if-no-files-found: warn
          retention-days: 30
      - name: Authorized blinded v2 evaluation
        if: vars.RUN_RESEARCH_EVAL_V2 == 'enabled'
        run: python -m market_radar_ai.agents.github_research_eval_v2
        env:
          GH_BUDGET_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPEN_API_KEY }}
          RUN_RESEARCH_EVAL_V2: enabled
      - name: Preserve v2 evaluation report
        if: always() && vars.RUN_RESEARCH_EVAL_V2 == 'enabled'
        uses: actions/upload-artifact@v4
        with:
          name: research-evaluation-v2
          path: artifacts/research-eval-v2/result.json
          if-no-files-found: warn
          retention-days: 30
      - name: Authorized v3 evaluation with deterministic issue register
        if: vars.RUN_RESEARCH_EVAL_V3 == 'enabled'
        run: python -m market_radar_ai.agents.github_research_eval_v3
        env:
          GH_BUDGET_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPEN_API_KEY }}
          RUN_RESEARCH_EVAL_V3: enabled
      - name: Preserve v3 evaluation report
        if: always() && vars.RUN_RESEARCH_EVAL_V3 == 'enabled'
        uses: actions/upload-artifact@v4
        with:
          name: research-evaluation-v3
          path: artifacts/research-eval-v3/result.json
          if-no-files-found: warn
          retention-days: 30
  public-data-capture:
    needs: tests
    if: github.repository == 'Chiizzie/market-radar-ai' && github.ref == 'refs/heads/phase-1/market-data-layer' && (github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[market]'
      - name: Capture stock and crypto evidence without AI or broker credentials
        run: python -m market_radar_ai.market_data.capture --output artifacts/public-data/capture.json
      - name: Export read-only dashboard snapshot
        if: always()
        run: python -m market_radar_ai.dashboard.export --capture artifacts/public-data/capture.json --output artifacts/public-data/dashboard.json
      - name: Evaluate data rehearsal readiness
        if: always()
        run: python -m market_radar_ai.dashboard.readiness --capture artifacts/public-data/capture.json --output artifacts/public-data/readiness.json
      - name: Preserve provider evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-market-data
          path: artifacts/public-data/*.json
          if-no-files-found: error
          retention-days: 30
  discovery-rehearsal:
    needs: tests
    if: github.repository == 'Chiizzie/market-radar-ai' && github.ref == 'refs/heads/phase-1/market-data-layer' && (github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[market]'
      - name: Discover both markets and capture a bounded batch
        run: python -m market_radar_ai.market_data.rehearsal --output-dir artifacts/discovery
      - name: Capture public macro announcements separately from prices
        if: always()
        continue-on-error: true
        run: python -m market_radar_ai.evidence.public_feed --output artifacts/discovery/news.json
      - name: Preserve results and queue checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discovery-to-dashboard
          path: artifacts/discovery/
          if-no-files-found: error
          retention-days: 30
