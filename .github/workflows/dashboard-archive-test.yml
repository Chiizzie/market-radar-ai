name: Manual dashboard archive delivery
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  archive:
    if: github.repository == 'Chiizzie/market-radar-ai' && github.ref == 'refs/heads/phase-1/market-data-layer' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: market-radar-ai-dashboard-archive
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q tests/test_lovable_delivery.py tests/test_review_export.py
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '13267625033'
          run-id: '41706847328'
          github-token: ${{ github.token }}
          path: historical-evidence
          merge-multiple: true
      - run: python -m market_radar_ai.dashboard.lovable_delivery historical-evidence
        env:
          SEND_LOVABLE_REVIEW: 'true'
          REVIEW_INGEST_SECRET: ${{ secrets.REVIEW_INGEST_SECRET }}
