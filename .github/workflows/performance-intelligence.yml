name: Paper performance intelligence
on:
  schedule:
    - cron: '20 7-23 * * 1-5'
  workflow_dispatch:
  workflow_run:
    workflows: ['Scheduled research collection']
    types: [completed]
  push:
    branches: [main]
    paths:
      - '.github/workflows/performance-intelligence.yml'
      - 'src/market_radar_ai/agents/performance_intelligence.py'
      - 'src/market_radar_ai/agents/research_artifacts.py'
permissions:
  contents: read
  actions: read
concurrency:
  group: market-radar-paper-performance-intelligence
  cancel-in-progress: false
jobs:
  evaluate:
    if: >-
      github.repository == 'Chiizzie/market-radar-ai' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.run_attempt == 1 &&
        contains(fromJSON('["success","failure"]'), github.event.workflow_run.conclusion)))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Respect weekday Dublin collection window
        id: window
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo('Europe/Dublin'))
          event = os.environ['GITHUB_EVENT_NAME']
          allowed = event in ('push','workflow_dispatch') or (now.weekday() < 5 and 8 <= now.hour <= 23)
          if event == 'workflow_run':
              with open(os.environ['GITHUB_EVENT_PATH']) as source:
                  parent = json.load(source)['workflow_run']
              dispatched = datetime.fromisoformat(parent['created_at'].replace('Z','+00:00'))
              # One ordinary scan slot per hour; never replay a delayed parent.
              allowed = allowed and dispatched.minute < 5 and 0 <= (now-dispatched).total_seconds() < 1200
          if allowed and event in ('schedule','workflow_run'):
              # Reuse the report workflows' bounded receipt check. Window-only
              # green jobs do not count as a completed report. Timers are fallback.
              api = 'repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/'
              def get(path):
                  response = subprocess.run(['gh','api',api+path],capture_output=True,check=True,timeout=8)
                  return json.loads(response.stdout)
              try:
                  runs = get('workflows/performance-intelligence.yml/runs?branch=main&status=success&per_page=8')
                  for run in runs['workflow_runs']:
                      ended = datetime.fromisoformat(run['updated_at'].replace('Z','+00:00'))
                      if not 0 <= (now-ended).total_seconds() < 2700: continue
                      artifacts = get('runs/'+str(run['id'])+'/artifacts')['artifacts']
                      name = 'performance-intelligence-'+str(run['id'])+'-'
                      if any(a['name'].startswith(name) and not a['expired'] for a in artifacts):
                          allowed = False
                          break
              except (subprocess.SubprocessError,OSError,ValueError,KeyError):
                  print('GitHub freshness check unavailable; using the bounded report window.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('run=' + str(allowed).lower() + '\n')
          PY
      - uses: actions/checkout@v4
        if: steps.window.outputs.run == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        if: steps.window.outputs.run == 'true'
        with:
          python-version: '3.12'
      - name: Install offline research reader
        if: steps.window.outputs.run == 'true'
        run: python -m pip install -e .
      - name: Read existing research artifacts and preserve candidate history
        id: intake
        if: steps.window.outputs.run == 'true'
        run: python -m market_radar_ai.agents.research_artifacts --after-close-backfill
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTION_SOURCE_VERSION: guarded-v2
      - name: Reproduce frozen portfolios and calculate performance
        if: steps.intake.outcome == 'success'
        env:
          EXECUTION_SOURCE_VERSION: guarded-v2
        run: |
          args=(--execution artifacts/evidence-intake/execution --contexts artifacts/evidence-intake/contexts.json --intake artifacts/evidence-intake/intake.json --output artifacts/performance)
          if test -f artifacts/evidence-intake/manual/report.json; then
            args+=(--manual artifacts/evidence-intake/manual)
          fi
          python -m market_radar_ai.agents.performance_intelligence "${args[@]}"
          cat artifacts/performance/performance.md >> "$GITHUB_STEP_SUMMARY"
      - name: Retain additive intake even if a later check fails
        if: always() && steps.window.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: performance-evidence-bank-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/evidence-intake/evidence-bank.sqlite.gz
          retention-days: 90
          if-no-files-found: warn
      - name: Retain performance, gaps and fixed experiment comparisons
        if: always() && steps.window.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: performance-intelligence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/performance/
            artifacts/evidence-intake/intake.json
            artifacts/evidence-intake/experiments.json
          retention-days: 90
          if-no-files-found: warn
