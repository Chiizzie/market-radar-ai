name: External research bank verification
on:
  push:
    branches: [improve/external-research-20261113]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,market]'
      - run: python -m pytest -q
      - run: python -m compileall -q src tests scripts
      - run: python scripts/verify_external_research.py --output artifacts/external-research/offline-receipt.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: external-research-${{ github.run_id }}
          path: artifacts/external-research/
          retention-days: 30
          if-no-files-found: error
