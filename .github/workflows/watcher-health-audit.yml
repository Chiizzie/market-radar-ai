name: Read-only watcher evidence audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/watcher-health-audit.yml']
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Retrieve the failed worker health record without models or market requests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, io, json, os, urllib.request, urllib.error, zipfile
          from urllib.parse import urlparse
          repo='Chiizzie/market-radar-ai'
          root='https://api.github.com/repos/'+repo
          auth={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','User-Agent':'market-radar-health-audit'}
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs):return None
          opener=urllib.request.build_opener(NoRedirect)
          url=root+'/actions/artifacts/13889244889/zip'
          try:
              response=opener.open(urllib.request.Request(url,headers=auth),timeout=60)
              data=response.read(1000000)
          except urllib.error.HTTPError as exc:
              if exc.code not in (301,302,303,307,308):raise
              target=exc.headers['Location'];parsed=urlparse(target)
              if parsed.scheme!='https' or not parsed.hostname or not parsed.hostname.endswith(('.blob.core.windows.net','.githubusercontent.com')):raise ValueError('unexpected_artifact_host')
              data=urllib.request.urlopen(target,timeout=60).read(1000000)
          z=zipfile.ZipFile(io.BytesIO(data))
          names=[n for n in z.namelist() if n.endswith('worker-health.json')]
          if len(names)!=1 or z.getinfo(names[0]).file_size>100000:raise ValueError('bounded_health_record_required')
          health=json.loads(z.read(names[0]))
          allowed={'polls','quotes_received','error_polls','model_calls','started_at','completed_at','state','critical_failure',
                   'startup_sync_seconds','startup_state','first_completed_poll_delay_seconds','requires_attention',
                   'maximum_poll_duration_seconds','maximum_poll_gap_seconds','trade_authorized','failure_counts',
                   'first_failure_at','last_failure_at','last_failure','comparison'}
          health={k:v for k,v in health.items() if k in allowed}
          result={'source_run':43094756451,'source_job':130780605358,'source_artifact':13889244889,'model_calls':0,'health':health}
          raw=json.dumps(result,indent=2)+'\n'
          print(raw)
          path='docs/incidents/2026-11-11-production-watcher-health.json'
          body={'message':'Record failed watcher health without paid requests','branch':'main','content':base64.b64encode(raw.encode()).decode()}
          try:
              with urllib.request.urlopen(urllib.request.Request(root+'/contents/'+path,headers=auth),timeout=30) as response:body['sha']=json.load(response)['sha']
          except urllib.error.HTTPError as exc:
              if exc.code!=404:raise
          request=urllib.request.Request(root+'/contents/'+path,data=json.dumps(body).encode(),headers=auth,method='PUT')
          with urllib.request.urlopen(request,timeout=30) as response:print('health_evidence_saved',response.status)
          PY
