name: Dashboard capture recovery
on:
  workflow_run:
    workflows: ['Paper performance intelligence']
    types: [completed]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/dashboard-delivery-recovery.yml
      - src/market_radar_ai/dashboard/snapshot_recovery.py
      - src/market_radar_ai/dashboard/snapshot_receipts.py
permissions:
  contents: read
  actions: read
concurrency:
  group: dashboard-capture-archive-recovery
  cancel-in-progress: false
jobs:
  restore:
    if: >-
      github.repository == 'Chiizzie/market-radar-ai' && github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Verify receipts and restore expired source captures as history
        run: python -m market_radar_ai.dashboard.snapshot_recovery
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_INGEST_SECRET: ${{ secrets.REVIEW_INGEST_SECRET }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-capture-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/dashboard-recovery/report.json
          retention-days: 90
          if-no-files-found: warn
