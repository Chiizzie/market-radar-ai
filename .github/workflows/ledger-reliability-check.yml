name: Ledger consistency verification
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ledger-reliability-check.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: market-radar-ai-budget
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'Chiizzie/market-radar-ai' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5ca5ffe1354729ddbbb735f8055fd0d50656f6d0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Rotate settled history and verify all accounting with a fresh reader
        env:
          GH_BUDGET_TOKEN: ${{ github.token }}
        run: python -m market_radar_ai.agents.budget_archive_maintenance --migrate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: budget-storage-${{ github.run_id }}
          path: artifacts/budget-storage/
          retention-days: 30
          if-no-files-found: error
