name: Read-only discovery provider probe
on:
  push:
    branches: [main]
    paths: ['.github/workflows/discovery-provider-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - name: Inspect public-data batch responses without exposing provider bodies
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
        run: |
          import json, os
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo
          import requests
          headers = {'APCA-API-KEY-ID': os.environ['ALPACA_API_KEY'], 'APCA-API-SECRET-KEY': os.environ['ALPACA_API_SECRET']}
          now = datetime.now(timezone.utc)
          start = now.astimezone(ZoneInfo('America/New_York')).replace(hour=9, minute=30, second=0, microsecond=0)
          groups = [["known",["NVDA","MSFT"]],["snapshot_batch",["A","AA","AACG","AACI","AACQ","AACT","AADX","AAGIY","AAL","AAMC","AAME","AAN","AAOI","AAON","AAP","AAPL","AARD","AAT","AAXN","ABB","ABBRF","ABBV","ABC","ABCB","ABCL","ABEO","ABEPF","ABEV","ABG","ABIO","ABL","ABLV","ABM","ABML","ABNB","ABOS","ABR","ABSI","ABT","ABUS","ABVC","ABVX","ABXXF","ACAB","ACAC","ACAD","ACB","ACCO","ACCV","ACDVF","ACEL","ACET","ACEV","ACFN","ACGL","ACHC","ACHV","ACI","ACIC","ACIU","ACIW","ACLLY","ACLS","ACM","ACMR","ACN","ACNB","ACND","ACOG","ACON","ACOPY","ACR","ACRE","ACRS","ACRV","ACRX","ACST","ACT","ACTD","ACTG","ACTHF","ACTU","ACU","ACUIF","ACXP","ACY","ADAG","ADAL","ADAP","ADBE","ADBT","ADC","ADCT","ADDYY","ADES","ADF","ADGI","ADI","ADIG","ADIL","ADM","ADMA","ADMP","ADNT","ADOM","ADP","ADPT","ADRNY","ADRX","ADS","ADSK","ADT","ADTI","ADTN","ADTX","ADUS","ADVB","ADXN","ADYEY","AEBI","AEE","AEG","AEHA","AEHR","AEIS","AEM","AEMD","AEO","AEP","AER","AERC","AERO1","AES","AESE","AESI","AETUF","AEXA","AEYE","AEZS","AFCG","AFG","AFIB","AFL","AFMD","AFRM","AFYA","AG","AGAGF","AGBA","AGBK","AGC","AGCC","AGCO","AGE","AGEN","AGFY","AGH","AGI","AGIO","AGL","AGLE","AGLXY","AGM","AGMB","AGMH","AGNC","AGO","AGOL","AGRI","AGRO","AGX","AGYS","AHAC","AHCO","AHH","AHI","AHPA","AHPI","AHR","AHT","AI1","AIAI","AIB","AIB1","AIBZ","AIDX","AIEV","AIG","AIHS","AII","AIKI","AIM","AIN","AINV","AIOK","AIP","AIR","AIRE","AIRG","AIRI","AIRO","AIRS","AIT","AIV","AIXI","AIZ","AJAX","AJG","AJX","AKAM","AKAN","AKBA","AKER","AKR","AKTS","AKTS1","ALAB","ALB","ALC","ALCC1","ALCE","ALCO","ALCY","ALDF","ALDX","ALE","ALEC","ALF","ALF1","ALG","ALGM","ALGN","ALGS","ALGT","ALH","ALHC","ALK","ALKS","ALKT","ALL","ALLE","ALLO","ALLR","ALLT","ALLY","ALM","ALMR","ALMS","ALMU","ALNY","ALPA","ALPMY","ALPP","ALPS","ALRM","ALRN","ALRS","ALSN","ALT","ALTG","ALTM","ALUS","ALV","ALVR","ALXO","ALYA","ALZN","AM","AMAL","AMAO","AMAT","AMBA","AMBC","AMBO","AMBQ","AMBZ","AMC","AMCI","AMCII","AMCR","AMCX","AMD","AME","AMEH","AMG","AMGN","AMH","AMHC","AMIX","AMKBY","AMKR","AMLM","AMLX","AMN","AMNF","AMOT","AMP","AMPG","AMPH","AMPL","AMPX","AMPY","AMRC","AMRH","AMRK","AMRN","AMRO","AMRX","AMRZ","AMS","AMSC","AMSF","AMSS","AMST","AMT","AMTB","AMTM","AMTX","AMV","AMVOY","AMWD","AMWL","AMX","AMZN","AN","ANAB","ANCN","ANDA","ANDE","ANDG","ANEB","ANET","ANF","ANFC","ANGI","ANGN","ANGO","ANGPY","ANIK","ANIP","ANIX","ANL","ANNX","ANPC","ANPDY","ANRO","ANT","ANTE","ANTM","ANTX","ANVS","ANY","ANZU","AOMR","AON","AONE","AOS","AOSL","AOUT","AP","APA","APAC","APAM","APC1","APCX","APD","APDN","APEI","APG","APH","API","APLD","APLE","APLT","APM","APMD","APO","APOG","APOP","APP","APPF","APPN","APPS","APRE","APT","APTV","APTX","APUS","APVO","APWC","APXC","APXT","APYX","AQB","AQMS","AQN","AQSP","AQST","AQU","AR","ARAI","ARAV","ARAY","ARBB","ARBK","ARBV","ARCB","ARCC","ARCO","ARCT","ARDS","ARDT","ARDX","ARE","AREB","AREC","AREN","ARES","ARGX","ARHS","ARI","ARIZ","ARLO","ARM","ARMK","ARMN","ARMP","ARNC","AROC","AROW","ARPO","ARQT","ARR","ARREF","ARRNF","ARRW","ARRY","ARTL","ARTNA","ARTV","ARVN","ARW","ARWR","ARX","ARXS","ARYA","ARYD","ARZGY","AS","ASAN","ASAZY","ASB","ASBH","ASC","ASCA","ASCCY","ASGLY","ASGN","ASH","ASIC","ASIX","ASLN","ASM","ASMB","ASML","ASND","ASNS","ASO","ASOMY","ASPA","ASPC","ASPC1","ASPE","ASPI1","ASPL","ASPN","ASPS","ASRV","ASST","ASTC","ASTE","ASTI","ASUR","ASX","ASYS","ATAC","ATAK","ATAT","ATCX1","ATEC","ATEN","ATEX","ATGE","ATGL","ATHA","ATHE","ATHM","ATHR","ATHX","ATI"]],["technical_batch",["RCT","SITC","STAK","AIRS","BDSX","VIVK","NVDA","GOGO","INTC","JDZG","DBGI","KPTI","IREN","CVRX","RAYA","VRAX","SPCX","LABT","CIIT","PLUG","PRAA","SXTP","KRT","IRTC","OBX","NTCL","CDT","CRWV","PLUT","NRDS","FROG","MU","NOK","ORCL","INO","NU","KRUS","NIO","ELPW","AMD","DOGZ","RIOT","AAL","ONDS","SMCI","PFE","MCHP","VALE","TSLA","SNAP","AAPL","LYG","MRVL","MARA","APLD","AMZN","SKHY","T","RIG","DNN","NFLX","CDE","GOOGL","F","TSE","TSEM","TSHA","TSIA","TSLX","TSM","TSN","TSP","TSQ","TSSI","TT","TTAM","TTAN","TTC","TTD","TTEC","TTEK","TTGT1","TTI","TTM","TTMI","TTNP","TTOO","TTRX","TTWO","TU","TUESQ","TUGC","TURB","TUSK","TUYA","TV","TW","TWCT","TWFG","TWG"]]]
          for endpoint in ('snapshots', 'bars'):
              for label, symbols in groups:
                  params = {'symbols': ','.join(symbols), 'feed': 'iex'}
                  if endpoint == 'bars':
                      params.update(timeframe='5Min', start=start.isoformat(), end=now.isoformat(), currency='USD', adjustment='raw', asof='-', sort='asc', limit=10000)
                  try:
                      r = requests.get('https://data.alpaca.markets/v2/stocks/'+endpoint, params=params, headers=headers, timeout=(5,15), allow_redirects=False)
                      data = r.json()
                      message = str(data.get('message', '')).lower() if isinstance(data, dict) else ''
                      bars = data.get('bars') if isinstance(data, dict) else None
                      print(json.dumps({'endpoint': endpoint, 'group': label, 'http_status': r.status_code, 'bytes': len(r.content), 'requested_count': len(symbols), 'root_count': len(data) if isinstance(data, dict) else None,
                          'envelope_keys': [k for k in ('bars', 'snapshots', 'next_page_token', 'message', 'code') if isinstance(data, dict) and k in data],
                          'root_symbol_count': len(set(symbols).intersection(data)) if isinstance(data, dict) else None,
                          'root_null_count': sum(v is None for v in data.values()) if isinstance(data, dict) else None,
                          'bars_symbol_count': len(bars) if isinstance(bars, dict) else None,
                          'unexpected_root_symbols': sorted(set(data)-set(symbols))[:5] if isinstance(data, dict) and endpoint=='snapshots' else [],
                          'unexpected_bar_symbols': sorted(set(bars)-set(symbols))[:5] if isinstance(bars, dict) else [],
                          'null_bar_series': sum(v is None for v in bars.values()) if isinstance(bars, dict) else None,
                          'next_page': bool(data.get('next_page_token')) if isinstance(data, dict) else None,
                          'invalid_symbol_error': 'symbol' in message and ('invalid' in message or 'not found' in message),
                          'capacity_error': 'limit' in message or 'too many' in message,
                          'authorization_error': r.status_code in (401,403)}))
                  except Exception as e:
                      print(json.dumps({'endpoint': endpoint, 'group': label, 'error_type': type(e).__name__}))
          print('Read-only diagnostics complete; no models, orders or notifications.')
        shell: python
