name: Verify repaired routing with market reads
on:
  push:
    branches: [verify/routing-live-20261116]
permissions:
  contents: read
  actions: read
jobs:
  verify:
    if: github.repository == 'Chiizzie/market-radar-ai' && github.ref == 'refs/heads/verify/routing-live-20261116'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7b358fb9fd9d96e8eed77a7a86a605ae82fa453b
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[market]'
      - uses: actions/download-artifact@v4
        with:
          name: scheduled-capture-43889064474
          run-id: 43889064474
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts/incident-source/
      - name: Recheck the failed selection using fresh provider observations
        run: >-
          python -m market_radar_ai.agents.strategy_routing_live
          --capture artifacts/incident-source/enriched-capture.json
          --news artifacts/incident-source/news.json
          --discovery artifacts/incident-source/discovery.json
          --manifest artifacts/incident-source/discovery-selection.json
          --output artifacts/verification/
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          TRADING212_API_KEY: ${{ secrets.TRADING212_API_KEY }}
          TRADING212_API_SECRET: ${{ secrets.TRADING212_API_SECRET }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repaired-routing-live-${{ github.run_id }}
          path: artifacts/verification/
          retention-days: 30
          if-no-files-found: error
