name: Scanner audit regression checks
on:
  push:
    branches: [fix/20261112-scanner-audit]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: Replay scanner and account fault regressions without provider access
        run: >-
          python -m pytest -q
          tests/test_scanner_audit_repairs.py tests/test_account_sync.py
          tests/test_stock_checks.py tests/test_catalogue_reuse.py
          tests/test_run_diagnostics.py tests/test_catalyst_links.py
          tests/test_opening_improvements.py tests/test_cross_scanner_audit.py
          tests/test_qualification_refresh.py tests/test_partial_collection_routing.py
      - run: python -m compileall -q src/market_radar_ai/dashboard src/market_radar_ai/market_data
