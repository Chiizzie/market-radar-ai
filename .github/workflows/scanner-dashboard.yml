name: Manual scanner dashboard capture
on:
  workflow_dispatch:
    inputs:
      send_snapshot:
        description: Deliver one capture-only snapshot to the authenticated dashboard
        type: boolean
        required: true
        default: false
permissions:
  contents: read
jobs:
  capture:
    if: github.repository == 'Chiizzie/market-radar-ai' && github.ref == 'refs/heads/phase-1/market-data-layer' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency:
      group: market-radar-ai-scanner-dashboard
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,market]'
      - run: python -m pytest -q tests/test_snapshot_delivery.py tests/test_dashboard_cache.py tests/test_market_capture.py
      - name: Capture bounded stock and crypto sample without AI
        id: collect
        continue-on-error: true
        run: python -m market_radar_ai.market_data.capture --output artifacts/scanner/capture.json --stocks NVDA MSFT AAPL AMD META AMZN GOOGL TSLA --crypto XBTEUR ETHEUR SOLEUR XRPEUR
      - name: Export honest coverage including provider failures
        run: python -m market_radar_ai.dashboard.export --capture artifacts/scanner/capture.json --output artifacts/scanner/dashboard.json
      - name: Send one signed research snapshot
        if: inputs.send_snapshot
        run: python -m market_radar_ai.dashboard.snapshot_delivery --capture artifacts/scanner/capture.json
        env:
          SEND_SCANNER_SNAPSHOT: 'true'
          REVIEW_INGEST_SECRET: ${{ secrets.REVIEW_INGEST_SECRET }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scanner-dashboard-${{ github.run_id }}
          path: artifacts/scanner/
          retention-days: 7
      - name: Preserve connectivity failure as a failed check
        if: steps.collect.outcome == 'failure'
        run: exit 1
