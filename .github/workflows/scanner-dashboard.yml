name: Manual scanner dashboard capture
on:
  workflow_dispatch:
    inputs:
      paid_analysis:
        description: Review one shortlisted candidate with eight metered AI calls
        type: boolean
        required: true
        default: false
      candidate_market:
        description: Candidate pool for the research review (auto prefers stocks)
        type: choice
        options: [auto, stocks, crypto]
        default: auto
      review_scope:
        description: 'Candidate momentum review or all-session stock context (context requires auto/stocks; no dashboard archive yet)'
        type: choice
        options: [candidate, context]
        default: candidate
      send_candidate_review:
        description: Archive completed candidate research to the authenticated dashboard
        type: boolean
        required: true
        default: false
      send_snapshot:
        description: Deliver one capture-only snapshot to the authenticated dashboard
        type: boolean
        required: true
        default: false
permissions:
  contents: read
jobs:
  capture:
    if: github.repository == 'Chiizzie/market-radar-ai' && github.ref == 'refs/heads/phase-1/market-data-layer' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: market-radar-ai-budget
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,market]'
      - run: python -m pytest -q tests/test_snapshot_delivery.py tests/test_dashboard_cache.py tests/test_market_capture.py tests/test_scanner_news.py tests/test_capture_shortlist.py tests/test_candidate_packages.py tests/test_candidate_review.py tests/test_candidate_delivery.py tests/test_evidence_enrichment.py tests/test_alpaca_provider.py tests/test_research_readiness.py tests/test_stock_context.py
      - name: Collect bounded stock, macro and tagged crypto news without AI
        id: news
        continue-on-error: true
        run: python -m market_radar_ai.evidence.scanner_feed --output artifacts/scanner/news.json --symbols NVDA MSFT AAPL AMD META AMZN GOOGL TSLA
      - name: Capture bounded stock and crypto sample without AI
        id: collect
        continue-on-error: true
        run: python -m market_radar_ai.market_data.capture --output artifacts/scanner/capture.json --stock-provider alpaca_iex --stocks NVDA MSFT AAPL AMD META AMZN GOOGL TSLA --crypto XBTEUR ETHEUR SOLEUR XRPEUR
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
      - name: Gather prior-session and extended-hours context without a twenty-bar gate
        id: context
        continue-on-error: true
        run: python -m market_radar_ai.market_data.stock_context --capture artifacts/scanner/capture.json --output artifacts/scanner/context-capture.json
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
      - name: Add public EUR reference bid and ask without broker admission
        run: python -m market_radar_ai.market_data.reference_quotes --capture artifacts/scanner/context-capture.json --output artifacts/scanner/enriched-capture.json
      - name: Assemble all-session context for six specialist roles
        run: python -m market_radar_ai.agents.context_packages --capture artifacts/scanner/enriched-capture.json --evidence artifacts/scanner/news.json --output artifacts/scanner/context-packages.json
      - name: Rank research candidates without AI or trade admission
        run: python -m market_radar_ai.market_data.capture_shortlist --capture artifacts/scanner/enriched-capture.json --output artifacts/scanner/shortlist.json
      - name: Assemble cited candidate evidence without paid model calls
        run: python -m market_radar_ai.agents.candidate_packages --capture artifacts/scanner/enriched-capture.json --evidence artifacts/scanner/news.json --output artifacts/scanner/candidate-packages.json
      - name: Check readiness and rehearse expiry without orders or AI
        run: python -m market_radar_ai.market_data.readiness --capture artifacts/scanner/enriched-capture.json --evidence artifacts/scanner/news.json --output artifacts/scanner/readiness.json
      - name: Export honest coverage including provider failures
        run: python -m market_radar_ai.dashboard.export --capture artifacts/scanner/enriched-capture.json --output artifacts/scanner/dashboard.json --evidence artifacts/scanner/news.json
      - name: Send one signed research snapshot
        if: inputs.send_snapshot
        run: python -m market_radar_ai.dashboard.snapshot_delivery --capture artifacts/scanner/enriched-capture.json --evidence artifacts/scanner/news.json
        env:
          SEND_SCANNER_SNAPSHOT: 'true'
          REVIEW_INGEST_SECRET: ${{ secrets.REVIEW_INGEST_SECRET }}
      - name: Review one generic candidate (dry run unless explicitly enabled)
        run: python -m market_radar_ai.agents.github_candidate_review --capture artifacts/scanner/enriched-capture.json --evidence artifacts/scanner/news.json --output artifacts/scanner/candidate-review
        env:
          CANDIDATE_MARKET: ${{ inputs.candidate_market || 'auto' }}
          REVIEW_SCOPE: ${{ inputs.review_scope || 'candidate' }}
          CANDIDATE_REVIEW_MODE: ${{ inputs.paid_analysis && 'paid' || 'dry_run' }}
          OPENAI_API_KEY: ${{ inputs.paid_analysis && secrets.OPEN_API_KEY || '' }}
          GH_BUDGET_TOKEN: ${{ inputs.paid_analysis && github.token || '' }}
          SEND_CANDIDATE_REVIEW: ${{ inputs.paid_analysis && inputs.send_candidate_review && 'true' || 'false' }}
          REVIEW_INGEST_SECRET: ${{ inputs.paid_analysis && inputs.send_candidate_review && secrets.REVIEW_INGEST_SECRET || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scanner-dashboard-${{ github.run_id }}
          path: artifacts/scanner/
          retention-days: 7
      - name: Preserve connectivity failure as a failed check
        if: steps.collect.outcome == 'failure' || steps.news.outcome == 'failure' || steps.context.outcome == 'failure'
        run: exit 1
