name: Broker paper execution verification
on:
  push:
    branches: [main]
    paths:
      - 'src/market_radar_ai/execution/**'
      - 'tests/test_demo_execution.py'
      - 'tests/fixtures/alpaca_held_stop_20261112.json'
      - '.github/workflows/demo-execution-verify.yml'
      - 'deploy/paper-exercise-request.json'
  workflow_dispatch:
    inputs:
      paper_order_exercise:
        description: 'Place a bounded one-share order exercise in the empty Alpaca PAPER account'
        type: boolean
        required: true
        default: false
      exercise_id:
        description: 'Unique ID for a new exercise; recover an existing attempt from its journal instead'
        type: string
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: broker-paper-engine-verification
  cancel-in-progress: false
jobs:
  fault-drills:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Isolated paper engine failure and recovery drills
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s tests -p test_demo_execution.py -v
      - name: Compile isolated engine
        run: python -m compileall -q src/market_radar_ai/execution
  paper-connectivity:
    needs: fault-drills
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read-only paper account and clock verification
        env:
          PYTHONPATH: src
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
        run: python -m market_radar_ai.execution.cli preflight --report artifacts/paper-preflight.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: broker-paper-preflight
          path: artifacts/paper-preflight.json
          retention-days: 30
          if-no-files-found: error
  bounded-paper-order-exercise:
    # Routine pushes and default manual runs are read-only at the broker.
    if: github.event_name == 'workflow_dispatch' && inputs.paper_order_exercise == true
    needs: [fault-drills, paper-connectivity]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[market]'
      - name: One-share engineering exercise in the dedicated Alpaca paper account
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          PAPER_EXERCISE_ID: ${{ inputs.exercise_id }}
        run: python -m market_radar_ai.execution.exercise --paper-orders --exercise-id "$PAPER_EXERCISE_ID"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: broker-paper-roundtrip
          path: artifacts/paper-exercise/
          retention-days: 90
          if-no-files-found: error
