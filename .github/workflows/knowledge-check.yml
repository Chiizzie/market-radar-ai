name: Offline knowledge verification
on:
  push:
    branches: [improve/knowledge-retrieval-20261113]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,market]'
      - run: python -m pytest -q
      - run: python -m compileall -q src tests
  frozen-library:
    needs: regressions
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Read and replay frozen event history without AI
        if: hashFiles('knowledge/library-20261113.json') == ''
        run: python -m market_radar_ai.agents.knowledge_build --download --output artifacts/knowledge
        env:
          REVIEW_INGEST_SECRET: ${{ secrets.REVIEW_INGEST_SECRET }}
      - name: Verify the committed frozen library without model or provider access
        if: hashFiles('knowledge/library-20261113.json') != ''
        run: python scripts/verify_knowledge_offline.py --output artifacts/knowledge/offline-receipt.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: knowledge-library-${{ github.run_id }}
          path: artifacts/knowledge/
          retention-days: 30
          if-no-files-found: error
