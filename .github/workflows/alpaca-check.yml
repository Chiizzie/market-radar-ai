name: Read-only Alpaca data check
on:
  workflow_dispatch:
  push:
    branches: ['phase-1/market-data-layer']
    paths:
      - '.github/workflows/alpaca-check.yml'
      - 'src/market_radar_ai/market_data/alpaca_check.py'
permissions:
  contents: read
concurrency:
  group: alpaca-data-check
  cancel-in-progress: false
jobs:
  data:
    if: github.repository == 'Chiizzie/market-radar-ai' && github.ref == 'refs/heads/phase-1/market-data-layer'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,market]'
      - run: python -m pytest -q tests/test_alpaca_check.py
      - name: Fetch IEX quotes, bars and news without AI or orders
        run: python -m market_radar_ai.market_data.alpaca_check
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alpaca-data-${{ github.run_id }}
          path: artifacts/alpaca-check/result.json
          retention-days: 7
