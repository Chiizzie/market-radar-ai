name: Strategy routing verification
on:
  push:
    branches: [improve/strategy-routing-20261113]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,market]'
      - run: python -m pytest -q
      - run: python -m compileall -q src tests
  source-histories:
    needs: regressions
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,market]'
      - name: Import the original method histories with receipt cutoffs
        if: hashFiles('knowledge/strategy-library-20261113.json') == ''
        run: python -m market_radar_ai.agents.strategy_knowledge_build --download --output artifacts/strategy-knowledge
        env:
          REVIEW_INGEST_SECRET: ${{ secrets.REVIEW_INGEST_SECRET }}
      - name: Exercise the frozen library and all strategy routes offline
        if: hashFiles('knowledge/strategy-library-20261113.json') != ''
        run: python scripts/verify_strategy_routing.py --output artifacts/strategy-knowledge/offline-receipt.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: strategy-knowledge-${{ github.run_id }}
          path: artifacts/strategy-knowledge/
          retention-days: 30
          if-no-files-found: error
