name: Execution history regression checks
on:
  push:
    branches: [fix/execution-history-20261113]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,market]'
      - run: python -m pytest -q
      - run: python -m compileall -q src tests
