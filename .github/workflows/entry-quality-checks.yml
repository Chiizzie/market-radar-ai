name: Entry quality regression checks
on:
  push:
    branches: [improve/entry-quality-20261113]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 86524f8d2a376ddaad521083fd4f0233fb8a3258
          path: deployed-config
          persist-credentials: false
      - name: Include actual deployment workflow for boundary tests
        run: cp deployed-config/.github/workflows/scheduled-scanner.yml .github/workflows/scheduled-scanner.yml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,market]'
      - run: python -m pytest -q
      - run: python -m compileall -q src tests
