name: Budget archive and quote diagnostic verification
on:
  push:
    branches: ['fix/ledger-quote-evidence-20261113']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,market]'
      - run: python -m pytest -q
      - run: python -m compileall -q src tests
      - run: python -m market_radar_ai.agents.offline_run --scenario objection
      - run: python -m market_radar_ai.agents.offline_run --scenario supported
