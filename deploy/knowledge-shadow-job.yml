  # Frozen knowledge preparation is free and independent of the paid reviewer.
  knowledge-shadow:
    needs: collect
    if: ${{ always() && needs.collect.outputs.review_ready == 'true' && github.repository == 'Chiizzie/market-radar-ai' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && !inputs.verify_outside_hours && vars.KNOWLEDGE_SHADOW_ENABLED != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: KNOWLEDGE_RUNTIME_REVISION
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: scheduled-capture-${{ github.run_id }}
          path: artifacts/scheduled/
      - name: Prepare frozen playbooks and historical cases without AI
        run: >-
          python -m market_radar_ai.agents.knowledge_shadow
          --capture artifacts/scheduled/enriched-capture.json
          --news artifacts/scheduled/news.json
          --output artifacts/knowledge-shadow
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: knowledge-shadow-${{ github.run_id }}
          path: artifacts/knowledge-shadow/
          retention-days: 30
          if-no-files-found: error
