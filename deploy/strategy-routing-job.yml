  # Independent strategy research; no model, budget, alert or order client.
  strategy-routing:
    needs: collect
    if: ${{ always() && needs.collect.outputs.review_ready == 'true' && github.repository == 'Chiizzie/market-radar-ai' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && !inputs.verify_outside_hours && vars.STRATEGY_ROUTING_ENABLED != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: STRATEGY_ROUTING_REVISION
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: scheduled-capture-${{ github.run_id }}
          path: artifacts/scheduled/
      - name: Evaluate independent strategies with bounded historical context
        run: >-
          python -m market_radar_ai.agents.strategy_routing_live
          --capture artifacts/scheduled/enriched-capture.json
          --news artifacts/scheduled/news.json
          --discovery artifacts/scheduled/discovery.json
          --manifest artifacts/scheduled/discovery-selection.json
          --output artifacts/strategy-routing
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          TRADING212_API_KEY: ${{ secrets.TRADING212_API_KEY }}
          TRADING212_API_SECRET: ${{ secrets.TRADING212_API_SECRET }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: strategy-routing-${{ github.run_id }}
          path: artifacts/strategy-routing/
          retention-days: 30
          if-no-files-found: error
